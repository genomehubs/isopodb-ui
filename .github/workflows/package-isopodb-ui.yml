name: package-isopodb-ui

on:
  push:
    branches:
      - main

jobs:
  build-and-push-isopodb:
    runs-on: ubuntu-latest
    steps:
      - id: genomehubs
        uses: pozetroninc/github-action-get-latest-release@master
        with:
          repository: genomehubs/genomehubs
      - name: Checkout
        uses: actions/checkout@v3
      - run: |
          git clone -b ${{ steps.genomehubs.outputs.release }} https://github.com/genomehubs/genomehubs
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: genomehubs/isopodb
      - name: Build and push IsopoDB image with content from repo
        uses: docker/build-push-action@v5
        with:
          context: .
          file: genomehubs/src/docker/ui/Dockerfile.site
          push: true
          build-args: |
            BASE_IMAGE=genomehubs/genomehubs-ui:${{ steps.genomehubs.outputs.release }}
            SITE_REPO=genomehubs/isopodb-ui
            SITE_BRANCH=main
            SITE_NAME=IsopoDB
            SITE_NAME_LONG=IsopoDB
            GH_CITATION_URL=
            GH_SUGGESTED_TERM=Isopoda
            GH_TAXONOMY=ncbi
          tags: |
            genomehubs/isopodb-ui:${{ steps.genomehubs.outputs.release }}
            genomehubs/isopodb-ui:latest
          labels: ${{ steps.meta.outputs.labels }}
